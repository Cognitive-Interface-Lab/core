name: CI

on:
  push:
    branches: [main, "m*/**"]
  pull_request:
    branches: [main, "m*/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
      - run: pnpm build
